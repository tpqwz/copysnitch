name: build

on:
  push:
  pull_request:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: install GTK 4
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev pkg-config
      - run: cargo test --workspace
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: copysnitchd-linux-x86_64
          path: target/release/copysnitchd
      - uses: actions/upload-artifact@v4
        with:
          name: copysnitch-ui-linux-x86_64
          path: target/release/copysnitch-ui
      - name: attach binaries to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp target/release/copysnitchd copysnitchd-linux-x86_64
          cp target/release/copysnitch-ui copysnitch-ui-linux-x86_64
          gh release upload "${{ github.event.release.tag_name }}" \
            copysnitchd-linux-x86_64 \
            copysnitch-ui-linux-x86_64 \
            --clobber
